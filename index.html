<style>
/* Qontak palette (estimasi, ASSUMPTION) — sumber: qontak-color-palette.html */
:root {
  --bg:#F7F9FC; --surface:#FFFFFF; --ink:#1F2633; --muted:#5E6B7D; --line:#E2E7EF;
  --edge:#E2E7EF; --field-edge:#8A93A3;
  --primary:#2B5FE3; --primary-50:#F2F5FE; --primary-100:#DDE4FB; --primary-300:#8FA8F2;
  --primary-600:#224DC0; --primary-700:#1A3C99; --primary-900:#0F2257;
  --active-bg:#DDE4FB; --active-ink:#1A3C99;
  --brand-ink:#2B5FE3;
  --btn-bg:#2B5FE3; --btn-ink:#FFFFFF;
  --header-bg:#FFFFFF; --focus:#2B5FE3;
  --danger:#E5484D; --danger-ink:#B42328; --ok:#1F9D55; --ok-ink:#157A41; --warning:#F2A100;
  --tint:#F2F5FE;
  --deep:#0F2257; --deep-ink:#EEF2F8; --deep-accent:#8FA8F2;
  --hero-bg:#F2F5FE; --hero-ink:#1F2633;
  --hole:#F7F9FC;
  --shadow:0 1px 2px rgba(31,38,51,.06), 0 6px 16px rgba(31,38,51,.06);
  --display:"Bricolage Grotesque","Arial Black",Impact,system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#0E1420; --surface:#161E2C; --ink:#E7ECF4; --muted:#9AA6B8; --line:#263142;
    --edge:#263142; --field-edge:#7A869A;
    --primary:#8FA8F2; --active-bg:#1F2E52; --active-ink:#C7D3F8;
    --brand-ink:#8FA8F2; --btn-bg:#8FA8F2; --btn-ink:#0E1420;
    --header-bg:#161E2C; --focus:#8FA8F2; --danger:#FF8A8E; --danger-ink:#FF8A8E; --ok:#5FD08F; --ok-ink:#5FD08F;
    --tint:#1A2438; --deep:#0A1A45; --hero-bg:#121B2E; --hero-ink:#E7ECF4; --hole:#0E1420;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 16px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg:#0E1420; --surface:#161E2C; --ink:#E7ECF4; --muted:#9AA6B8; --line:#263142;
  --edge:#263142; --field-edge:#7A869A;
  --primary:#8FA8F2; --active-bg:#1F2E52; --active-ink:#C7D3F8;
  --brand-ink:#8FA8F2; --btn-bg:#8FA8F2; --btn-ink:#0E1420;
  --header-bg:#161E2C; --focus:#8FA8F2; --danger:#FF8A8E; --danger-ink:#FF8A8E; --ok:#5FD08F; --ok-ink:#5FD08F;
  --tint:#1A2438; --deep:#0A1A45; --hero-bg:#121B2E; --hero-ink:#E7ECF4; --hole:#0E1420;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 16px rgba(0,0,0,.25);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 72px); }
body { margin:0; background:var(--bg); color:var(--ink); font:400 1.0625rem/1.55 var(--body); -webkit-font-smoothing:antialiased; }
body::before { content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top, 0px); background:var(--header-bg); z-index:10; }
img, svg { max-width:100%; }
a { color:inherit; }
h1,h2,h3 { font-family:var(--display); font-weight:800; line-height:1.02; letter-spacing:-0.02em; margin:0; }
h1 { font-size:clamp(2.2rem,6vw,3.6rem); }
h2 { font-size:clamp(1.8rem,4.4vw,2.8rem); }
h3 { font-size:1.35rem; letter-spacing:-0.01em; }
p { margin:0 0 1em; max-width:62ch; }
.muted { color:var(--muted); }
.small { font-size:.9rem; }
:focus-visible { outline:3px solid var(--focus); outline-offset:3px; border-radius:4px; }
main:focus { outline:none; }
.wrap { width:100%; max-width:1160px; margin-inline:auto; padding-inline:20px; }
.skip { position:absolute; left:12px; top:-60px; background:var(--btn-bg); color:var(--btn-ink); padding:10px 16px; border-radius:8px; z-index:30; }
.skip:focus { top:calc(env(safe-area-inset-top, 0px) + 8px); }

/* demo notice + header */
.demo-bar { background:var(--deep); color:var(--primary-100); font-size:.85rem; text-align:center; padding:6px 12px; }
.site-head { position:sticky; top:env(safe-area-inset-top, 0px); z-index:20; background:var(--header-bg); border-bottom:1px solid var(--edge); }
.head-in { display:flex; align-items:center; gap:12px 24px; flex-wrap:wrap; padding-block:10px; }
.brand { display:flex; align-items:center; gap:8px; text-decoration:none; font:800 1.6rem/1 var(--display); letter-spacing:-0.03em; color:var(--brand-ink); }
.brand svg { width:30px; height:30px; flex:none; }
.nav { display:flex; gap:4px; margin-left:auto; overflow-x:auto; max-width:100%; }
.nav a { text-decoration:none; font-weight:700; padding:10px 14px; border-radius:999px; white-space:nowrap; }
.nav a:hover { background:color-mix(in srgb, var(--primary) 8%, transparent); }
.nav a[aria-current="page"] { background:var(--active-bg); color:var(--active-ink); }
@media (max-width:860px) { .nav { order:3; width:100%; margin-left:0; } }

/* buttons */
.btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:48px; padding:0 24px; border-radius:999px; border:2px solid var(--btn-bg); background:var(--btn-bg); color:var(--btn-ink); font:700 1rem var(--body); text-decoration:none; cursor:pointer; }
.btn:hover { background:var(--primary-600); border-color:var(--primary-600); }
.btn.ghost:hover { background:var(--tint); }
.home-coex .btn:hover { background:var(--primary-50); border-color:var(--primary-50); }
.home-coex .btn.ghost:hover { background:rgba(255,255,255,.08); }
:root[data-theme="dark"] .btn:not(.ghost):hover { background:#B4C6F6; border-color:#B4C6F6; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn:not(.ghost):hover { background:#B4C6F6; border-color:#B4C6F6; } }
.btn.ghost { background:transparent; color:var(--primary); border-color:var(--primary); }
.btn.small { min-height:40px; padding:0 16px; font-size:.95rem; }
.btn[disabled] { opacity:.5; cursor:not-allowed; }
.link-btn { background:none; border:0; padding:0; font:inherit; color:inherit; text-decoration:underline; cursor:pointer; }

/* hero */
.hero { --focus:var(--primary); --hole:var(--hero-bg); background:var(--hero-bg); color:var(--hero-ink); border-bottom:1px solid var(--edge); }
.hero h1 { color:var(--primary); }

.hero-in { padding-block:clamp(28px,6vw,72px) clamp(28px,5vw,56px); }
.hero h1 { font-size:clamp(2.8rem,11.9vw,8.4rem); letter-spacing:-0.045em; line-height:.86; margin-bottom:.12em; }
.pull { --p:0; display:flex; align-items:center; gap:0; margin:8px 0 14px; }
.pull-roll { width:clamp(96px,16vw,150px); flex:none; will-change:transform; }
.strip-wrap { position:relative; flex:1; height:clamp(48px,7vw,64px); margin-left:-14px; min-width:0; }
.strip { position:absolute; inset:0 auto 0 0; width:calc(var(--p) * 1%); overflow:hidden; background:var(--primary); color:#FFFFFF; display:flex; align-items:center; border-radius:4px 0 0 4px; }
.strip span { font:800 clamp(1.1rem,3vw,1.6rem)/1 var(--display); letter-spacing:.08em; white-space:nowrap; padding-left:28px; }
.tab { position:absolute; top:50%; left:calc(var(--p) * 1%); transform:translate(calc(var(--p) * -1%), -50%); background:var(--surface); color:var(--primary); border:3px solid var(--primary); border-radius:999px; font:800 .95rem var(--display); letter-spacing:.04em; padding:10px 18px; cursor:grab; touch-action:none; user-select:none; min-height:44px; }
.tab:active { cursor:grabbing; }
.hero-hint { min-height:1.6em; font-weight:700; margin:0 0 18px; }
.hero-sub { font-size:clamp(1.1rem,2.2vw,1.4rem); max-width:36ch; margin-bottom:22px; }
.hero-cta { display:flex; flex-wrap:wrap; gap:12px; }

/* sections */
.section { padding-block:clamp(40px,7vw,80px); }
.section-head { display:flex; justify-content:space-between; align-items:end; gap:16px; flex-wrap:wrap; margin-bottom:28px; }

/* catalog */
.chips { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:24px; }
.chip { min-height:44px; padding:0 18px; border-radius:999px; border:1px solid var(--field-edge); background:transparent; color:var(--ink); font:700 1rem var(--body); cursor:pointer; }
.chip[aria-pressed="true"] { background:var(--active-bg); color:var(--active-ink); border-color:transparent; }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:24px; }
.card { display:flex; flex-direction:column; background:var(--surface); border:1px solid var(--edge); border-radius:6px 28px 6px 28px; box-shadow:var(--shadow); overflow:hidden; }
.card-main { text-decoration:none; display:block; flex:1; }

const CASES=[
 {id:'k1',tag:'Case 1',title:'<i>Payment method</i> WABA masih tersimpan data yang lama (BSP/Visa <i>owned by Client</i>)',err:'Edit payment method: Visa ···· **** terpilih sebagai <i>default</i>',code:'Meta Business Suite › WhatsApp accounts',
  cause:'<i>Default payment method</i> di WABA masih kartu klien. Setelah terkoneksi ke Qontak, <i>payment method</i> harus a.n. Qontak Tumbuh Makmur.',
  acts:['⚠️ <i>Offboard</i> ulang dan menggunakan WABA baru.',
   'Klik <i>Close</i>, jangan <i>Confirm</i>, pada dialog "<i>Edit payment method</i>". Memilih kartu Visa akan menjadikannya <i>default</i> untuk semua tagihan (Panduan: <a href="https://business.facebook.com/latest/settings/whatsapp_account/" target="_blank" rel="noopener">Business Settings › WhatsApp accounts</a>).',
   'Pastikan nomor sudah berstatus <i>connected</i> di Qontak, dan Qontak (Hub Qontak) tercantum sebagai <i>partner</i> di WABA tersebut.',
   'Eskalasi ke tim internal terkait (<i>Billing</i>/<i>Tech Support</i>) untuk memasang <i>credit line</i> a.n. Qontak Tumbuh Makmur. Lampirkan <i>Business ID</i> dan WABA ID dari URL di <i>address bar</i>.',
   'Setelah <i>credit line</i> terpasang, minta klien menghapus kartu Visa dari <i>payment method</i> WABA agar tidak terjadi tagihan ganda.',
   'Verifikasi ulang di <i>Business Settings</i> › <i>WhatsApp accounts</i> bahwa <i>payment method</i> sudah a.n. Qontak Tumbuh Makmur.'],sk:['s6']},
 {id:'k2',tag:'Case 2',title:'Nomor sudah terdaftar di akun WhatsApp',err:'"This phone number is already registered to a WhatsApp account. To use this number, disconnect it from the existing account."',code:'#2494064',
  cause:'Nomor masih terdaftar di akun WhatsApp atau tertaut ke portofolio FBBM lain (WABA, FB <i>Page</i>, <i>Ads</i>, atau IG).',
  acts:['Pastikan nomor sudah berada di 1 portofolio FBBM yang sama. Jika berbeda: hapus nomor dari WABA, FB <i>Page</i>, <i>Ads</i>, dan IG di portofolio lain, atau lanjutkan di portofolio FBBM sebelumnya yang sudah <i>BV verified</i> (<i>best practice</i>).',
   'Jika Coex, ulangi <i>embedded signup</i>, lalu pilih nomor WhatsApp <i>Business App</i> yang sudah tersimpan atau "<i>Enter a new phone number</i>". Lanjutkan proses sesuai instruksi.',
   'Pastikan nomor terpasang di WhatsApp <i>Business App</i>, bukan WhatsApp Messenger biasa, dan aplikasinya sudah versi terbaru.',
   '⚠️ Hapus WhatsApp <i>Business</i> terlebih dahulu dari akun <i>App</i>-nya. Namun, jika ada kebutuhan <i>History Chat</i>, pastikan percakapan diselesaikan dan di-<i>backup</i> terlebih dahulu.',
   'Jika nomor masih di WhatsApp Messenger biasa, pindahkan dulu ke WA <i>Business App</i>. Ingat syarat aktif minimal 30 hari.'],sk:['s0','s1','s7']},
 {id:'k3',tag:'Case 3',title:'Nomor belum <i>eligible</i>',err:'"Your phone number isn\'t eligible to connect to the WhatsApp Business Platform. More activity on the WhatsApp Business App is needed to help determine eligibility."',code:'#3441045',
  cause:'Meta menilai aktivitas nomor di WA <i>Business App</i> belum cukup.',
  acts:['Cek umur nomor di WA <i>Business App</i>: apakah sudah ≥ 30 hari sejak pertama kali didaftarkan di aplikasi tersebut.',
   'Minta klien menggunakan WA <i>Business App</i> secara aktif dan wajar (mengirim dan menerima percakapan dengan pelanggan, bukan <i>blast</i>), lalu coba <i>onboarding</i> ulang beberapa hari kemudian dengan cek berkala setiap 1x24 jam hingga nomor <i>eligible</i>.',
   'Pastikan nomor tidak pernah <i>restricted</i>/<i>disabled</i> dan aplikasinya sudah versi terbaru.',
   'Jika semua syarat terpenuhi tetapi <i>error</i> tetap muncul, catat kode <i>error</i> dan eskalasi ke Meta <i>support</i>.',
   '⚠️ Hapus WhatsApp <i>Business</i> terlebih dahulu dari akun <i>App</i>-nya. Namun, jika ada kebutuhan <i>History Chat</i>, pastikan percakapan diselesaikan dan di-<i>backup</i> terlebih dahulu.',
   'Untuk alternatif solusi:<ul class="sub"><li>Bisa dicoba WA API</li><li>Ganti nomor lain</li></ul>'],sk:['s1','s2']},
 {id:'k5',tag:'Case 4',title:'Chat tidak masuk ke dashboard Qontak',err:'Nomor WA Coex sudah terintegrasi, tetapi chat dari pelanggan tidak muncul di dashboard Qontak',code:'WhatsApp <i>Business App</i> › <i>Settings</i> › <i>Business Platform</i>',
  cause:'Kuota MUV habis, <i>payment method</i> WABA bukan a.n. Qontak, atau <i>Business Platform</i> di WhatsApp <i>Business App</i> sudah tidak terkoneksi ke Qontak.',
  acts:['Pastikan kuota MUV masih tersedia di dashboard Qontak.',
   'Pastikan <i>payment method</i> di WABA (FBBM) sudah a.n. Qontak Tumbuh Makmur (lihat Case 1).',
   'Pastikan <i>Business Platform</i> di WhatsApp <i>Business App</i> masih terkoneksi ke Qontak. Jika tidak terkoneksi, dugaan penyebab dari hasil observasi:<ul class="sub"><li>Dilepas secara manual dari aplikasi</li><li>Ada aktivitas <i>login</i> ulang di <i>device</i> baru (maks. 5 <i>device</i>)</li><li>Penyebab lain belum diketahui (<i>unknown</i>)</li></ul>',
   'Jika poin 2 atau 3 tidak terpenuhi, lakukan integrasi ulang (<i>reintegrate</i>) seperti di awal.'],sk:['s6']},
 {id:'k4',tag:'Case 5',title:'Nomor sudah tertaut ke FB <i>Page</i>',err:'"The phone number is already linked to a Facebook Page. To continue, you need to unlink your account from the Facebook page or enter a different number."',code:'#2655123',
  cause:'Nomor sudah ditautkan ke FB <i>Page</i> (misalnya untuk tombol WhatsApp atau <i>Click-to-WhatsApp ads</i>) di luar portofolio yang dipakai.',
  acts:['Jika Coex, ulangi <i>onboarding</i> lewat jalur Coex (lihat Case 2 poin 2) dan pastikan FB <i>Page</i> berada dalam satu portofolio FBBM yang sama dengan WABA.',
   'Jika tetap memakai jalur API, minta admin FB <i>Page</i> melepas tautan WhatsApp melalui pengaturan <i>Page</i> › <i>Linked accounts</i> › WhatsApp › <i>Disconnect</i>, lalu coba lagi setelah beberapa menit (Panduan: <a href="https://www.facebook.com/help/www/2783732558314697" target="_blank" rel="noopener">https://www.facebook.com/help/www/2783732558314697</a>).',
   '⚠️ Sebelum melepas tautan, informasikan bahwa <i>ads</i> dengan tombol WhatsApp dari nomor tersebut bisa terdampak. Sebaiknya jeda dulu <i>ads</i> yang aktif.',
   '⚠️ Hapus WhatsApp <i>Business</i> terlebih dahulu dari akun <i>App</i>-nya. Namun, jika ada kebutuhan <i>History Chat</i>, pastikan percakapan diselesaikan dan di-<i>backup</i> terlebih dahulu.'],sk:['s7']},
 {id:'k6',tag:'Case 6',title:'Nomor masih terhubung ke <i>Business AI Agent</i>',err:'"Your Business AI agent is already linked to this phone number. Open the WhatsApp Business app, go to Business Tools > Your Business AI > AI replies, and Disconnect AI to unlink the agent."',code:'#3441060',
  cause:'Nomor masih terhubung ke <i>AI Agent</i> dari Meta, perlu di-<i>disconnect</i> dulu.',
  limit:'<i>Business AI Agent</i> dari Meta tidak bisa dipakai bersamaan dengan integrasi WA Coex. <i>AI Agent</i> perlu di-<i>disconnect</i> terlebih dahulu, dengan risiko <i>AI Agent</i> menjadi tidak aktif (<i>deactive</i>).',
  acts:['Informasikan risikonya ke <i>Client</i>: <i>Business AI Agent</i> akan tidak aktif (<i>deactive</i>) setelah di-<i>disconnect</i>.',
   '<i>Disconnect</i> <i>AI Agent</i> melalui WhatsApp <i>Business App</i> › <i>Business Tools</i> › <i>Business AI</i> › <i>AI Replies</i> › <i>Disconnect AI Agent</i>.',
   'Ulangi <i>onboarding</i> WA Coex setelah <i>AI Agent</i> terputus.'],sk:[]},
 {id:'k7',tag:'Case 7',title:'Nomor sudah tertaut ke <i>Automatic Events</i>',err:'"Your phone number is already linked to Automatic Events. To use it for Embedded Signup, turn off Auto lists in Business Tools > Lists in your WhatsApp Business app."',code:'#3441061',
  cause:'Fitur <i>Auto lists</i> (<i>Automatic Events</i>) masih aktif di WhatsApp <i>Business App</i>, sehingga nomor belum bisa dipakai untuk <i>embedded signup</i>.',
  acts:['Untuk fitur <i>Auto lists</i> perlu dimatikan. Setelah dimatikan, chat tidak lagi otomatis dikelompokkan ke daftar (<i>list</i>) di WA <i>Business App</i>.',
   'Matikan <i>Auto lists</i> melalui WhatsApp <i>Business App</i> › <i>Business Tools</i> › <i>Lists</i> › nonaktifkan <i>Auto lists</i>.',
   'Pastikan aplikasi WA <i>Business App</i> sudah versi terbaru, tunggu beberapa menit, lalu ulangi <i>embedded signup</i> WA Coex.',
   'Jika <i>error</i> tetap muncul, catat kode <i>error</i> (#3441061) dan eskalasi ke Meta <i>support</i> melalui "<i>Report error to Hub Qontak</i>".'],sk:[]}
];

return { view, mount, count: CASES.length };

    gloss:   `<pattern id="${id}" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0 10L10 0" stroke="#fff" stroke-opacity=".2" stroke-width="1"/></pattern>`
  };
  return p[kind] || `<pattern id="${id}" width="4" height="4" patternUnits="userSpaceOnUse"></pattern>`;
}
function roll(kind, color, label) {
  const id = 'rp' + (++uid);
  return `<svg viewBox="0 0 200 200" role="img" aria-label="${esc(label)}">
    <defs>${pattern(kind, id)}</defs>

    <circle cx="100" cy="100" r="84" fill="${color}"/>
    <circle cx="100" cy="100" r="84" fill="url(#${id})"/>
    <circle cx="100" cy="100" r="84" fill="none" stroke="rgba(0,0,0,.35)" stroke-width="3"/>
    <circle cx="100" cy="100" r="62" fill="none" stroke="rgba(0,0,0,.16)" stroke-width="2"/>
    <circle cx="100" cy="100" r="46" fill="#C9A46A" stroke="rgba(0,0,0,.35)" stroke-width="2.5"/>
    <circle cx="100" cy="100" r="34" style="fill:var(--hole)" stroke="rgba(0,0,0,.35)" stroke-width="2.5"/>
    <path d="M38 70A66 66 0 0 1 90 33" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="6" stroke-linecap="round"/>

}

/* ---------- Cart maths ---------- */
function saveCart() { store.set(K.cart, cart); updateBadge(); }
function updateBadge() { const el = $('#cart-count'); if (!el) return; el.textContent = cart.reduce((n, l) => n + l.qty, 0); }
function addToCart(pid, vid, qty = 1) {
  const l = cart.find(x => x.pid === pid && x.vid === vid);
  if (l) l.qty = Math.min(99, l.qty + qty); else cart.push({ pid, vid, qty });
  saveCart();
}
function lines() {
  return cart.map(l => {
    const p = product(l.pid); if (!p) return null;
    const v = variantOf(p, l.vid);
    return { ...l, p, v, price: v.price, total: v.price * l.qty };
  }).filter(Boolean);
}
function calc(shipId) {
  const ls = lines();
  const subtotal = ls.reduce((n, l) => n + l.total, 0);
  const vc = CONFIG.vouchers[voucher];
  const discount = vc ? Math.round(subtotal * vc.percent / 100) : 0;
  const ship = CONFIG.shipping.find(s => s.id === shipId) || CONFIG.shipping[0];
  const free = ship.id === 'standard' && subtotal - discount >= CONFIG.freeShippingOver && subtotal > 0;
  const shipping = subtotal === 0 ? 0 : (free ? 0 : ship.fee);
  return { ls, subtotal, discount, shipping, free, ship, total: subtotal - discount + shipping };
}
function summaryHTML(shipId, withLines) {
  const c = calc(shipId);
  return `${withLines ? `<ul class="lines" style="border:0">${c.ls.map(l => `<li class="sum-row" style="padding:4px 0"><span>${esc(l.p.name)} (${esc(l.v.label)}) × ${l.qty}</span><span>${money(l.total)}</span></li>`).join('')}</ul>` : ''}
    <p class="sum-row"><span>Subtotal</span><span>${money(c.subtotal)}</span></p>
    ${c.discount ? `<p class="sum-row disc"><span>Voucher ${esc(voucher)}</span><span>−${money(c.discount)}</span></p>` : ''}
    <p class="sum-row"><span>${esc(c.ship.label)}</span><span>${c.free ? 'Free' : money(c.shipping)}</span></p>
    <p class="sum-row total"><span>Total</span><span>${money(c.total)}</span></p>`;
}

function validate(f) {
  const d = Object.fromEntries(new FormData(f).entries());
  const e = {};
  if (!d.name || d.name.trim().length < 2) e.name = 'Enter your full name.';
  if (digits(d.phone).length < 8 || digits(d.phone).length > 15) e.phone = 'Enter a phone number with 8 to 15 digits.';
  if (d.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email.trim())) e.email = 'Enter a valid email address or leave it empty.';
  if (!d.address || d.address.trim().length < 6) e.address = 'Enter your street address.';
  if (!d.city || !d.city.trim()) e.city = 'Enter your city.';
  if (!d.postcode || digits(d.postcode).length < 4) e.postcode = 'Enter a postcode with at least 4 digits.';
  return { d, e };
}

function handleCheckout(f) {
  const { d, e } = validate(f);
  $$('[data-err]', f).forEach(n => { n.textContent = e[n.dataset.err] || ''; });
  $$('input, textarea', f).forEach(i => i.setAttribute('aria-invalid', e[i.name] ? 'true' : 'false'));
  const keys = Object.keys(e);
  if (keys.length) {
    $('#form-err').textContent = `Fix ${keys.length} ${keys.length === 1 ? 'field' : 'fields'} to place your order.`;
    const first = f.elements[keys[0]]; if (first) first.focus();
    return;
  }
  const c = calc(d.shipping);
  const pay = CONFIG.payments.find(p => p.id === d.payment) || CONFIG.payments[0];
  const now = Date.now(), t = new Date(now);
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let suffix = ''; for (let i = 0; i < 4; i++) suffix += chars[Math.floor(Math.random() * chars.length)];
  const yymmdd = String(t.getFullYear()).slice(2) + String(t.getMonth() + 1).padStart(2, '0') + String(t.getDate()).padStart(2, '0');
  const order = {
    id: `ST-${yymmdd}-${suffix}`, createdAt: now,
    items: c.ls.map(l => ({ name: l.p.name, variant: l.v.label, price: l.price, qty: l.qty })),
    customer: { name: d.name.trim(), phone: d.phone.trim(), email: (d.email || '').trim(), address: d.address.trim(), city: d.city.trim(), postcode: d.postcode.trim(), notes: (d.notes || '').trim() },
    delivery: { id: c.ship.id, label: c.ship.label, note: c.ship.note, fee: c.shipping },
    payment: { id: pay.id, label: pay.label, note: pay.note },
    voucher: c.discount ? voucher : '',
    totals: { subtotal: c.subtotal, discount: c.discount, shipping: c.shipping, total: c.total },
    status: 0, history: [now]
  };
  const orders = store.get(K.orders, []); orders.unshift(order); store.set(K.orders, orders);
  store.set(K.customer, { name: order.customer.name, phone: order.customer.phone, email: order.customer.email, address: order.customer.address, city: order.customer.city, postcode: order.customer.postcode });
  cart = []; voucher = ''; store.set(K.voucher, ''); saveCart();
  location.hash = `#/order/${order.id}`;
}

/* ---------- Hero pull ---------- */
function initPull() {
  const root = $('#pull'); if (!root) return;
  const wrap = $('.strip-wrap', root), tab = $('.tab', root), rollEl = $('.pull-roll', root), hint = $('#pull-hint');
  let p = 0, drag = false, moved = false, startX = 0;
  const set = v => {
    p = Math.max(0, Math.min(100, v));
    root.style.setProperty('--p', p);
    tab.setAttribute('aria-valuenow', Math.round(p));
    rollEl.style.transform = `rotate(${-p * 8}deg)`;
    hint.textContent = p >= 96 ? 'That is one good fix. Now pick your .' : (p < 4 ? 'Grab the tab and pull.' : 'Keep going.');
  };
  const animateTo = t => {
    if (reduceMotion()) return set(t);
    const from = p, t0 = performance.now(), dur = 700;
    const step = n => { const k = Math.min(1, (n - t0) / dur), e = 1 - Math.pow(1 - k, 3); set(from + (t - from) * e); if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  };
  tab.addEventListener('pointerdown', e => { drag = true; moved = false; startX = e.clientX; tab.setPointerCapture(e.pointerId); });
  tab.addEventListener('pointermove', e => {
    if (!drag) return;
    if (Math.abs(e.clientX - startX) > 4) moved = true;
    if (moved) { const r = wrap.getBoundingClientRect(); set(((e.clientX - r.left) / r.width) * 100); }
  });
  const end = () => { if (drag && !moved) animateTo(p < 50 ? 100 : 0); drag = false; };
  tab.addEventListener('pointerup', end);
  tab.addEventListener('pointercancel', () => { drag = false; });
  tab.addEventListener('keydown', e => {
    const m = { ArrowRight:10, ArrowUp:10, ArrowLeft:-10, ArrowDown:-10 };
    if (e.key in m) { e.preventDefault(); set(p + m[e.key]); }
    else if (e.key === 'Home') { e.preventDefault(); set(0); }
    else if (e.key === 'End') { e.preventDefault(); set(100); }
  });
  set(0);
}

/* ---------- Router ---------- */
const TITLES = { shop:'Shop', how:'How to order', cart:'Your cart', checkout:'Checkout', order:'Your order', support:'Support', coex:'Case WA Coex', tutorial:'Tutorial' };
function render(fresh) {
  const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean).map(decodeURIComponent);
  const [a, b] = parts;
  let html, title = 'Activation Qontak: Cloth, masking, OPP and more';
  switch (a) {
    case undefined: html = homeView(); break;
    case 'shop': html = b ? productView(b) : shopView(); title = (b && product(b) ? product(b).name : TITLES.shop) + ' | Activation Qontak'; break;
    case 'how': html = howView(); title = TITLES.how + ' | Activation Qontak'; break;
    case 'cart': html = cartView(); title = TITLES.cart + ' | Activation Qontak'; break;
    case 'checkout': html = checkoutView(); title = TITLES.checkout + ' | Activation Qontak'; break;
    case 'order': html = orderView(b || ''); title = TITLES.order + ' | Activation Qontak'; break;
    case 'support': html = supportView(); title = TITLES.support + ' | Activation Qontak'; break;
    case 'coex': html = window.COEX ? COEX.view(b) : notFoundView(); title = TITLES.coex + ' | Activation Qontak'; break;
    case 'tutorial': html = tutorialView(); title = TITLES.tutorial + ' | Activation Qontak'; break;
    default: html = notFoundView();
  }
  const main = $('#main');
  main.innerHTML = html;
  document.title = title;
  $$('#nav a').forEach(l => l.removeAttribute('aria-current'));
  const nav = $(`#nav a[data-nav="${a || 'home'}"]`); if (nav) nav.setAttribute('aria-current', 'page');
  if (a === 'shop' && !b) paintShop();
  if (a === 'shop' && b) paintPdp();
  if (a === 'coex' && window.COEX) COEX.mount();
  if (!a) initPull();
  if (fresh) { window.scrollTo(0, 0); main.focus({ preventScroll: true }); }
}

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const act = t.dataset.act, k = t.dataset.k;
  const [pid, vid] = (k || '').split(':');
  const line = cart.find(l => l.pid === pid && l.vid === vid);
  switch (act) {
    case 'filter': shopFilter = t.dataset.v; paintShop(); break;
    case 'quick': { const p = product(t.dataset.pid); addToCart(p.id, p.variants[0].id, 1); toast(`Added ${esc(p.name)} <a href="#/cart">View cart</a>`); break; }
    case 'qty+': { const o = $('#pdp-qty'); o.textContent = Math.min(99, Number(o.textContent) + 1); paintPdp(); break; }
    case 'qty-': { const o = $('#pdp-qty'); o.textContent = Math.max(1, Number(o.textContent) - 1); paintPdp(); break; }
    case 'add': case 'buy': {
      const s = pdpState(); if (!s) break;
      addToCart(s.p.id, s.v.id, s.qty);
      if (act === 'buy') location.hash = '#/checkout';
      else toast(`Added ${s.qty} × ${esc(s.p.name)} (${esc(s.v.label)}) <a href="#/cart">View cart</a>`);
      break;
    }
    case 'inc': if (line) { line.qty = Math.min(99, line.qty + 1); saveCart(); render(false); } break;
    case 'dec': if (line) { line.qty = Math.max(1, line.qty - 1); saveCart(); render(false); } break;
    case 'remove': cart = cart.filter(l => l !== line); saveCart(); render(false); toast('Item removed'); break;
    case 'print': window.print(); break;
    case 'copy': {
      const o = store.get(K.orders, []).find(x => x.id === t.dataset.id); if (!o) break;
      const text = orderText(o);
      const fallback = () => { const ta = $('textarea.msg'); if (ta) { $('details', ta.closest('aside')).open = true; ta.focus(); ta.select(); } toast('Select and copy the message shown'); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => toast('Order message copied'), fallback);
      else fallback();
      break;
    }
    case 'advance': {
      const orders = store.get(K.orders, []); const o = orders.find(x => x.id === t.dataset.id);
      if (o && o.status < STATUSES.length - 1) { o.status++; o.history[o.status] = Date.now(); store.set(K.orders, orders); render(false); }
      break;
    }
  }
});
document.addEventListener('change', e => {
  if (e.target.name === 'variant') paintPdp();
  if (e.target.name === 'shipping' && $('#co-sum')) $('#co-sum').innerHTML = summaryHTML(e.target.value, true);
});
document.addEventListener('submit', e => {
  const f = e.target;
  if (f.id === 'checkout-form') { e.preventDefault(); handleCheckout(f); }
  else if (f.id === 'voucher-form') {
    e.preventDefault();
    const code = f.elements.code.value.trim().toUpperCase();
    if (!code) { voucher = ''; store.set(K.voucher, ''); render(false); return; }
    if (CONFIG.vouchers[code]) { voucher = code; store.set(K.voucher, code); render(false); }
    else { $('#vc-msg').style.color = 'var(--danger)'; $('#vc-msg').textContent = 'That code is not valid.'; }
  }
  else if (f.id === 'track-form') {
    e.preventDefault();
    const id = f.elements.id.value.trim().toUpperCase(), ph = digits(f.elements.phone.value);
    const o = store.get(K.orders, []).find(x => x.id === id && ph && digits(x.customer.phone) === ph);
    if (o) location.hash = `#/order/${o.id}`;
    else { $('#t-err').textContent = 'No order matches that ID and phone number on this device. Check both and try again.'; }
  }
});
window.addEventListener('hashchange', () => render(true));

/* ---------- Boot ---------- */
if (CONFIG.demo) $('#demo-bar').hidden = false;
updateBadge();
render(false);
